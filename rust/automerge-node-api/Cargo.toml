[package]
name = "automerge-node-api"
description = "A Node-API wrapper for the rust implementation of automerge"
repository = "https://github.com/automerge/automerge"
version = "0.1.0"
authors = ["Kræn Hansen <mail@kraenhansen.dk>"]
categories = []
readme = "README.md"
edition = "2021"
license = "MIT"
rust-version = "1.90.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
automerge = { path = "../automerge", features = ["utf16-indexing"] }
automerge-js-common = { path = "../automerge-js-common" }
hex = "^0.4.3"
napi = { version = "3", features = ["napi9", "serde-json"] }
napi-derive = "3"
serde = "^1.0"
serde_json = "^1.0"
thiserror = "^2.0.12"

[build-dependencies]
napi-build = "2.2.0"
